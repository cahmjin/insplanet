<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no, email=no, address=no, date=no">
<!-- adaptive routing: desktop/tablet (≥768) bounce to the PC page; runs before CSS so no mobile flash -->
<script>if(matchMedia('(min-width:768px)').matches)location.replace('index.html'+location.search+location.hash);</script>
<title>Insplanet — Mobile (hero WIP)</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
<style>
  /* ===== ISOLATED MOBILE HERO WORKSPACE =====
     Only the hero — NO below-fold sections — so nothing overflows horizontally
     and the layout viewport stays = device width (the below-hero desktop sections
     were blowing vw out to 496 and pushing the fixed right-side controls off the
     375 screen). Merge the mobile rules (already in style.css @media ≤767) back
     into index.html once the lower sections are built for mobile. */
  html,body{overflow-x:clip}                   /* safety: no horizontal scroll/expansion.
     clip, NOT hidden — overflow-x:hidden makes body a scroll container, which
     KILLS position:sticky (the m-beyond pin). clip blocks the bleed without that. */
  #stage{height:100svh}                         /* fit the VISIBLE viewport (real mobile chrome) */
  /* bg arcs: main.js normally sizes these; here they scale with the viewport
     width (vw) instead of fixed px. Figma 375 basis: 603→160.8vw, 132→35.2vw … */
  #bg-line .circ{width:160.8vw;height:160.8vw;border-radius:50%}
  #bg-line .circ-1{left:35.2vw;top:-0.8vw}
  #bg-line .circ-2{left:0.53vw;top:13.87vw}
</style>
</head>
<body>
<div id="page-root">
<div id="stage">
  <canvas id="blob" width="1920" height="1080"></canvas>

  <div class="content">
    <div id="left-block">
      <img id="symbol" src="assets/symbol.svg" alt="">

      <div id="head-title">
        <span class="line-1">We Are</span>
        <span class="line-2">Insplanet</span>
      </div>

      <div id="sub-title">
        <span class="subtitle-head">호기심이 가득한 오늘, 무한한 가능성의 내일.</span>
        <span class="subtitle-body">인스플래닛은 조금 더 즐겁고 진화된<br class="sb-br-m"> 디지털 경험을 만들기 위해 새로움을 고민합니다.<br class="sb-br-d"><span class="sb-rest">본질에 대한 이해와 넓은 시야로 누구나 공감할 수 있는 가치를 만듭니다.</span></span>
      </div>
    </div>
  </div>
</div>

<!-- chapter 02 (mobile): Beyond UX — pinned swap in ONE viewport (Figma 1807:26605 / 1817:23457).
     Both texts overlap in the same centred spot inside a sticky stage; scrolling through the tall
     track scrubs Beyond out and the statement in (scrub script at the bottom of this file). -->
<section class="m-beyond-pin">
  <div class="m-beyond-stage">
    <h2 class="m-beyond-title"><span class="line-1">Beyond UX</span><span class="line-2">The AX Creator</span></h2>
    <p class="m-beyond-statement"><span>기술에 가치를 더해,</span><span>내일의 설렘을 완성합니다.</span></p>
  </div>
</section>

<!-- shared header chrome — inlined for the isolated workspace (mirrors js/shared-ui.js) -->
<div id="bg-line">
  <span class="circ circ-1"></span>
  <span class="circ circ-2"></span>
</div>
<a id="ci-logo" href="index.html" aria-label="Insplanet 홈"><img src="assets/ci_logo.svg" alt="Insplanet"></a>
<a id="lets-talk" href="contact.html"><span>Let&rsquo;s Talk</span></a>
<div id="full-menu" tabindex="-1"><img src="assets/menu_icon.svg" alt="menu"></div>
<div id="scroll-hint">
  <span class="bar"></span>
  <span class="label">SCROLL</span>
</div>

</div><!-- /#page-root -->

<!-- hero blob (self-contained, no menu/main.js dependency) -->
<script src="js/blob.js"></script>
<!-- Lenis smooth scroll — same elastic feel as desktop (lerp .09). Touch stays
     native (momentum) by default; wheel/trackpad get the eased glide. -->
<script src="js/vendor/lenis.min.js"></script>
<script>
  // smooth scroll (desktop parity)
  (function(){
    if(!window.Lenis || matchMedia('(prefers-reduced-motion:reduce)').matches) return;
    var lenis=new Lenis({lerp:0.09,smoothWheel:true});
    window.__lenis=lenis;
    (function raf(t){lenis.raf(t);requestAnimationFrame(raf);})();
  })();
  // hero reveal (blur-in). main.js does this on the real page; minimal version here.
  (function(){
    function go(){
      var h=document.getElementById('head-title'), s=document.getElementById('sub-title');
      if(h)h.classList.add('in'); if(s)s.classList.add('in');
    }
    if(document.fonts&&document.fonts.ready){document.fonts.ready.then(go);}
    setTimeout(go,500); // fallback if fonts hang
  })();

  // chapter 02 scrub: pin the stage, swap Beyond -> statement by scroll progress
  // (port of the desktop js/main.js beyond-swap; same phase constants)
  (function(){
    var chapter=document.querySelector('.m-beyond-pin');
    if(!chapter)return;
    var bLines=[].slice.call(chapter.querySelectorAll('.m-beyond-title .line-1,.m-beyond-title .line-2'));
    var fLines=[].slice.call(chapter.querySelectorAll('.m-beyond-statement span'));
    function clamp(v){return Math.min(1,Math.max(0,v));}
    function set(l,s){l.style.opacity=s.toFixed(3);l.style.filter='blur('+(16*(1-s)).toFixed(2)+'px)';}
    if(matchMedia('(prefers-reduced-motion:reduce)').matches){bLines.forEach(function(l){set(l,0);});fLines.forEach(function(l){set(l,1);});return;}
    var ticking=false;
    function update(){
      ticking=false;
      var scrub=chapter.offsetHeight-innerHeight;
      var p=scrub>0?clamp(-chapter.getBoundingClientRect().top/scrub):0;
      bLines.forEach(function(l,i){var o=i*0.06; set(l, clamp(p<0.33 ? (p-o)/0.20 : 1-(p-0.45-o)/0.15));});
      fLines.forEach(function(l,i){set(l, clamp((p-0.62-i*0.06)/0.18));});
    }
    addEventListener('scroll',function(){if(!ticking){ticking=true;requestAnimationFrame(update);}},{passive:true});
    addEventListener('resize',update);
    update();
  })();
</script>
</body>
</html>
